services:
  dev-db:
    image: postgres:16-alpine
    container_name: topupng_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: topupng
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  test-db:
    image: postgres:16-alpine
    container_name: topupng_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: topupng_test
    ports:
      - "5434:5432"

volumes:
  pgdata: